name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}
  schedule:
    # “At 08:35 on every day-of-week from Monday through Friday.”
    #
    # Staggered across the six SDK repos (java :30, python :35, php :40,
    # go :45, csharp :50, typescript :55). They all run their live suites
    # against the one shared e2e sandbox, and firing together stampedes the
    # auth path's cold public-key cache -> Envelope /decrypt times out at 3s
    # -> every endpoint 500s (Sentry CORE-API-1N0). Keep these apart.
    - cron: 35 8 * * 1-5

permissions:
  contents: read

jobs:
  # Lint the SDK and the test suite once (the generated SDK only needs one
  # interpreter to lint).
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repo
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2
        with:
          persist-credentials: false

      - name: Use Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install poetry
        uses: abatilo/actions-poetry@fd0e6716a0de25ef6ade151b8b53190b0376acfd # v3
        with:
          poetry-version: 2.1.3

      - name: Install dependencies
        run: poetry install --no-root

      - name: Run linter
        run: poetry run pylint -j=0 tests src

  # E2E suites, sharded by directory so wall-clock stays low. Each shard
  # provisions its own merchant accounts (one per test module), so they are fully
  # independent. The shard map lives here; pytest runs just that directory.
  # Runs on main only (push, schedule, dispatch). The key lives in the `e2e`
  # Environment, which only main can use, so a branch workflow can't read it.
  e2e:
    name: e2e (${{ matrix.shard }})
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: e2e
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: flows, path: tests/flows }
          - { shard: processing, path: tests/processing }
          - { shard: backoffice, path: tests/backoffice }

    steps:
      - name: Check out the repo
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2
        with:
          persist-credentials: false

      - name: Use Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install poetry
        uses: abatilo/actions-poetry@fd0e6716a0de25ef6ade151b8b53190b0376acfd # v3
        with:
          poetry-version: 2.1.3

      - name: Install dependencies
        run: poetry install --no-root

      - name: Run ${{ matrix.shard }} suite
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          SUITE_PATH: ${{ matrix.path }}
        run: poetry run pytest "$SUITE_PATH"

  # Offline tests (JWT + webhook signing) across the supported Python versions —
  # fast cross-version sanity that needs no sandbox.
  offline:
    name: offline (py ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out the repo
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2
        with:
          persist-credentials: false

      - name: Use Python ${{ matrix.python }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install poetry
        uses: abatilo/actions-poetry@fd0e6716a0de25ef6ade151b8b53190b0376acfd # v3
        with:
          poetry-version: 2.1.3

      - name: Install dependencies
        run: poetry install --no-root

      - name: Run offline suite
        run: poetry run pytest tests/test_auth.py tests/test_webhooks.py

  # Single stable required check. Branch rulesets require THIS context (not the
  # per-shard matrix jobs, whose names change when shards are added). On a PR it
  # means lint and the offline suites passed; on main it also means the live
  # suite passed, which is what the publish workflow waits for.
  ci-complete:
    name: ci-complete
    needs: [lint, e2e, offline]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs passed
        env:
          LINT: ${{ needs.lint.result }}
          E2E: ${{ needs.e2e.result }}
          OFFLINE: ${{ needs.offline.result }}
          ON_MAIN: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          if [ "$LINT" != "success" ] || [ "$OFFLINE" != "success" ]; then
            echo "lint: $LINT, offline: $OFFLINE"
            exit 1
          fi
          if [ "$ON_MAIN" != "true" ] && [ "$E2E" = "skipped" ]; then
            exit 0
          fi
          if [ "$E2E" != "success" ]; then
            echo "e2e: $E2E"
            exit 1
          fi

  # Endpoint reach of the live suite, written to the run summary. Runs after the
  # live suite on main. continue-on-error keeps a failed report from failing the
  # CI run, which is what the publish workflow waits for.
  coverage:
    name: coverage
    needs: e2e
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: e2e
    steps:
      - name: Check out the repo
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2
        with:
          persist-credentials: false

      - name: Use Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install poetry
        uses: abatilo/actions-poetry@fd0e6716a0de25ef6ade151b8b53190b0376acfd # v3
        with:
          poetry-version: 2.1.3

      - name: Install dependencies
        run: poetry install --no-root

      - name: Run full suite with HTTP tracking
        id: suite
        continue-on-error: true
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          GR4VY_TRACK_HTTP: "1"
        run: poetry run pytest tests

      - name: Build endpoint-coverage report
        run: poetry run python scripts/endpoint_coverage.py

      - name: Write the report to the run summary
        env:
          SUITE: ${{ steps.suite.outcome }}
        run: |
          if [ "$SUITE" != "success" ]; then
            echo "> ⚠️ **The test suite failed in this run, so the reach below is incomplete.**" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          fi
          cat coverage/endpoint-coverage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if the suite failed
        if: steps.suite.outcome != 'success'
        run: exit 1

  notify:
    needs: [lint, e2e, offline]
    runs-on: ubuntu-latest
    if: ${{ contains(needs.*.result, 'failure') }}
    steps:
      - name: Slack Notification
        uses: rtCamp/action-slack-notify@e31e87e03dd19038e411e38ae27cbad084a90661 # v2
        if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'github-actions[bot]')
        env:
            SLACK_USERNAME: Python SDK
            SLACK_TITLE: Python SDK
            SLACK_WEBHOOK: ${{ secrets.SLACK_SDK_WEBHOOK_URL }}
            SLACK_CHANNEL: sdk-updates
            SLACK_MSG_AUTHOR: gr4vy-code
            SLACK_ICON_EMOJI: ":gr4vy:"
            SLACK_COLOR: "${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}"
            SLACK_MESSAGE_ON_SUCCESS: "CI passed"
            SLACK_MESSAGE_ON_FAILURE: "CI failed"
            SLACK_FOOTER: ""
